[project]
name = "atomx-toolkit"
version = "0.3.1"
description = "AtoMx SFTP transfer with double-download integrity check and email reporting."
readme = "README.md"
authors = [{ name = "wuwenrui555", email = "wuwenruiwwr@outlook.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "paramiko>=3,<5",
    "typer>=0.12",
    "rich>=15.0.0",
    "pingme @ git+https://github.com/wuwenrui555/pingme.git@v0.1.2",
    "jianglab-name-standard @ git+https://github.com/wuwenrui555/jianglab-name-standard.git@v0.1.1",
]

[project.scripts]
atomx-toolkit = "atomx_toolkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
